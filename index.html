<!DOCTYPE html>
<!--
FFF PLAYGROUND V22
V20 visual foundation preserved; V22 refines tube packing, terrain, gravel, price and modification limits.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>FFF Playground V24</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Genos:ital,wght@1,300;1,400&family=JetBrains+Mono:wght@500;600;700;800&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --text:#f4efe9;
  --panel:rgba(8,11,15,.58);
  --line:rgba(168,184,194,.13);
  --thumb:11px;
  --top:max(8px,env(safe-area-inset-top));
  --bottom:max(8px,env(safe-area-inset-bottom));
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  color:var(--text);
  font-family:"JetBrains Mono",monospace;
  background:
    radial-gradient(
      ellipse at 50% 47%,
      rgba(255,214,178,.12),
      rgba(130,96,72,.06) 28%,
      transparent 58%
    ),
    linear-gradient(
      #0a0a0b,
      #070606 48%,
      #030405
    );
  overscroll-behavior:none;
}

button,
input{
  font:inherit;
  color:inherit;
}

button{
  cursor:pointer;
}

#app{
  position:fixed;
  inset:0;
  min-width:320px;
  min-height:560px;
  overflow:hidden;
  isolation:isolate;
}

#app::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at 50% 48%,
      rgba(255,240,215,.075),
      rgba(255,214,178,.032) 18%,
      transparent 36%
    ),
    radial-gradient(
      circle at 50% 50%,
      transparent 0 26%,
      rgba(0,0,0,.09) 50%,
      rgba(0,0,0,.34) 76%,
      rgba(0,0,0,.76)
    );
}

#view{
  position:absolute;
  inset:0;
  z-index:0;
  touch-action:none;
}

#view canvas{
  display:block;
  width:100%;
  height:100%;
  outline:0;
}

.top{
  position:absolute;
  top:var(--top);
  left:8px;
  right:8px;
  height:28px;
  z-index:30;
  border:1px solid rgba(97,186,208,.14);
  border-radius:9px;
  background:
    linear-gradient(
      90deg,
      rgba(255,86,174,.02),
      rgba(7,10,14,.9) 18% 82%,
      rgba(70,214,240,.018)
    );
  box-shadow:0 8px 20px rgba(0,0,0,.24);
  backdrop-filter:blur(14px);
}

.top::before{
  content:"";
  position:absolute;
  left:7px;
  right:7px;
  top:-1px;
  height:1px;
  background:
    linear-gradient(
      90deg,
      rgba(255,90,175,.6),
      transparent 28% 72%,
      rgba(75,224,246,.58)
    );
}

.top::after{
  content:"";
  position:absolute;
  left:14%;
  right:14%;
  bottom:-1px;
  height:1px;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,108,168,.18),
      rgba(83,220,243,.18),
      transparent
    );
}

.pricebox{
  position:absolute;
  top:2px;
  bottom:2px;
  left:4px;
  width:54px;
  display:flex;
  align-items:center;
  overflow:visible;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
}

.price-svg{
  display:block;
  width:54px;
  height:24px;
  overflow:visible;
}

.brand{
  position:absolute;
  left:68px;
  right:118px;
  top:0;
  bottom:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
  font:
    600 clamp(15.8px,2.78vw,27.2px)/1
    "Baloo 2",
    sans-serif;
  letter-spacing:-.025em;
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.72);
}

.right{
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  gap:4px;
  max-width:122px;
}

.play{
  overflow:hidden;
  white-space:nowrap;
  font:
    italic 400 12.8px/1
    "Genos",
    sans-serif;
  background:
    linear-gradient(
      96deg,
      #67d9ff,
      #69cfff 26%,
      #56e7d0 62%,
      #7df59c
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.ver{
  padding:2px 3px;
  border:1px solid rgba(89,213,238,.12);
  border-radius:4px;
  background:rgba(5,8,12,.52);
  font:
    700 6px/1
    "Orbitron",
    monospace;
  letter-spacing:.08em;
  color:#9cf0ff;
}

.panel{
  position:absolute;
  z-index:12;
  padding:5px;
  border:1px solid var(--line);
  border-radius:9px;
  background:
    linear-gradient(
      150deg,
      rgba(255,255,255,.01),
      transparent 38%
    ),
    linear-gradient(
      330deg,
      rgba(118,198,217,.01),
      transparent 36%
    ),
    var(--panel);
  box-shadow:0 12px 28px rgba(0,0,0,.27);
  backdrop-filter:blur(12px);
}

.panel::before,
.panel::after{
  content:"";
  position:absolute;
  top:-1px;
  width:23%;
  height:1px;
  pointer-events:none;
}

.panel::before{
  left:6px;
  background:
    linear-gradient(
      90deg,
      rgba(255,113,177,.16),
      transparent
    );
}

.panel::after{
  right:6px;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(108,214,235,.16)
    );
}

#main{
  top:40px;
  left:8px;
  width:156px;
}

#array{
  top:40px;
  right:8px;
  width:145px;
}

#roots{
  top:94px;
  right:8px;
  width:145px;
}

#front{
  left:8px;
  bottom:var(--bottom);
  width:156px;
}

#back{
  right:8px;
  bottom:var(--bottom);
  width:156px;
}

.head{
  position:absolute;
  top:-8px;
  left:7px;
  right:7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  pointer-events:none;
}

.side{
  padding:0 5px;
  background:#080a0d;
  color:rgba(205,217,224,.5);
  font:
    600 7px/13px
    "Orbitron",
    monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.fix{
  pointer-events:auto;
  min-width:34px;
  height:15px;
  padding:0 5px;
  border:1px solid rgba(151,178,190,.15);
  border-radius:5px;
  background:rgba(5,8,11,.92);
  color:rgba(205,218,225,.48);
  font:
    700 7px/13px
    "JetBrains Mono",
    monospace;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.fix.active{
  color:#a6f7e2;
  border-color:rgba(113,241,207,.48);
  box-shadow:0 0 8px rgba(70,224,190,.14);
}

.panel.linked .unit{
  opacity:.42;
  pointer-events:none;
  filter:saturate(.55);
}

.unit + .unit{
  margin-top:4px;
  padding-top:4px;
  border-top:1px solid rgba(255,255,255,.03);
}

.row{
  display:grid;
  grid-template-columns:minmax(46px,1fr) 92px;
  align-items:center;
  gap:2px;
}

.label{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:rgba(244,239,233,.93);
  font:
    600 clamp(8px,1.18vw,10px)/1
    "JetBrains Mono",
    monospace;
  letter-spacing:-.02em;
}

.unit[data-key="diameter"] .label{
  color:#f1e6bf;
  text-shadow:
    0 0 4px rgba(255,214,92,.18),
    0 0 9px rgba(255,190,42,.10);
}

.unit[data-key="arches"] .label{
  color:#d9f3df;
  text-shadow:
    0 0 4px rgba(95,235,145,.18),
    0 0 9px rgba(61,203,111,.10);
}

.unit[data-key="roots"] .label{
  color:#e2c4aa;
  text-shadow:
    0 0 4px rgba(155,91,44,.28),
    0 0 10px rgba(98,52,24,.17);
}

.step{
  display:grid;
  grid-template-columns:21px minmax(48px,1fr) 21px;
  width:92px;
  height:24px;
  border:1px solid rgba(166,182,192,.11);
  border-radius:6px;
  overflow:hidden;
  background:rgba(3,6,9,.42);
}

.step button,
.step input{
  min-width:0;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
}

.step button{
  padding:0;
  font-size:15px;
  color:rgba(223,231,236,.74);
}

.step button:hover{
  background:rgba(75,196,220,.05);
  color:#fff;
}

.step input{
  width:100%;
  padding:0 2px;
  border-left:1px solid rgba(166,184,194,.06);
  border-right:1px solid rgba(166,184,194,.06);
  text-align:center;
  font:
    600 9.5px/1
    "JetBrains Mono",
    monospace;
  font-variant-numeric:tabular-nums slashed-zero;
  letter-spacing:-.035em;
  color:rgba(247,242,238,.96);
  appearance:textfield;
}

.sliderbox{
  position:relative;
  width:100%;
  height:13px;
  margin-top:2px;
  --zero:50%;
}

.slider{
  position:absolute;
  inset:0;
  width:100%;
  height:13px;
  margin:0;
  appearance:none;
  -webkit-appearance:none;
  background:transparent;
  cursor:pointer;
}

.slider::-webkit-slider-runnable-track{
  height:2px;
  border-radius:.5px;
  clip-path:
    polygon(
      1px 0,
      calc(100% - 1px) 0,
      100% 50%,
      calc(100% - 1px) 100%,
      1px 100%,
      0 50%
    );
  background:
    linear-gradient(
      90deg,
      rgba(135,147,155,.22),
      rgba(93,203,228,.55)
    );
}

.slider::-webkit-slider-thumb{
  width:13px;
  height:13px;
  margin-top:-5.5px;
  border:0;
  border-radius:50%;
  appearance:none;
  -webkit-appearance:none;
  background:transparent;
  box-shadow:none;
  opacity:0;
}

.slider::-moz-range-track{
  height:2px;
  border:0;
  border-radius:.5px;
  background:
    linear-gradient(
      90deg,
      rgba(135,147,155,.22),
      rgba(93,203,228,.55)
    );
}

.slider::-moz-range-thumb{
  width:13px;
  height:13px;
  border:0;
  border-radius:50%;
  background:transparent;
  box-shadow:none;
  opacity:0;
}

.thumbdot{
  position:absolute;
  top:50%;
  left:50%;
  width:11px;
  height:11px;
  transform:translate(-50%,-50%);
  border:.8px solid rgba(118,215,239,.96);
  border-radius:50%;
  background:#05080b;
  box-shadow:
    0 0 1px rgba(158,232,250,.28),
    0 0 3px rgba(82,190,222,.08);
  pointer-events:none;
  z-index:2;
}

.zero{
  position:absolute;
  top:1px;
  left:var(--zero);
  width:1px;
  height:10px;
  transform:translateX(-50%);
  background:rgba(143,221,238,.42);
  pointer-events:none;
}

.unit.iszero .zero{
  background:rgba(153,230,244,.86);
  box-shadow:0 0 6px rgba(75,204,229,.22);
}

.hint{
  position:absolute;
  left:50%;
  bottom:18%;
  z-index:3;
  transform:translateX(-50%);
  pointer-events:none;
  color:rgba(204,192,183,.44);
  font:
    500 clamp(8px,1.1vw,10px)/1
    "JetBrains Mono",
    monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  transition:opacity .35s;
}

.hint.hidden{
  opacity:0;
}

.legend{
  position:absolute;
  left:50%;
  bottom:calc(var(--bottom) + 126px);
  z-index:14;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:10px;
  padding:4px 8px;
  border:1px solid rgba(170,186,196,.08);
  border-radius:999px;
  background:rgba(6,8,11,.32);
  box-shadow:0 8px 18px rgba(0,0,0,.22);
  backdrop-filter:blur(8px);
  pointer-events:none;
  white-space:nowrap;
}

.legend b{
  font-size:7px;
  color:rgba(217,225,229,.48);
  letter-spacing:.08em;
  text-transform:uppercase;
}

.legend i{
  font-style:normal;
  font-size:7px;
  color:rgba(214,221,225,.52);
  text-transform:uppercase;
}

.legend span{
  font-size:8px;
  font-weight:700;
  color:rgba(244,239,233,.9);
  font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums slashed-zero;
  font-feature-settings:"zero" 1,"tnum" 1;
  letter-spacing:-.035em;
}

@media(max-width:560px){
  .top{
    height:27px;
  }

  .pricebox{
    width:54px;
    padding:0;
  }

  .price-svg{
    width:52px;
    height:21px;
  }

  .brand{
    left:59px;
    right:102px;
    font-size:clamp(11.6px,3.28vw,15.8px);
  }

  .right{
    right:4px;
    gap:3px;
    max-width:108px;
  }

  .play{
    font-size:12.8px;
  }

  .ver{
    font-size:5.5px;
    padding:2px;
  }

  .legend{
    bottom:calc(var(--bottom) + 132px);
    gap:6px;
    padding:3px 6px;
  }

  .legend b,
  .legend i{
    font-size:6px;
  }

  .legend span{
    font-size:7px;
  }

  #main,
  #array{
    top:39px;
  }

  #roots{
    top:92px;
  }

  #main,
  #front,
  #back{
    width:min(156px,calc(50vw - 9px));
  }

  #array,
  #roots{
    width:min(145px,calc(47vw - 8px));
  }

  .panel{
    padding:5px 4px;
  }

  .row{
    grid-template-columns:minmax(44px,1fr) 90px;
    gap:1px;
  }

  .step{
    width:90px;
    grid-template-columns:20px minmax(48px,1fr) 20px;
  }

  .label{
    font-size:9px;
  }

  .step input{
    font-size:9px;
  }
}

@media(max-height:700px){
  #main,
  #array{
    top:38px;
  }

  #roots{
    top:91px;
  }

  .hint{
    display:none;
  }

  .legend{
    bottom:calc(var(--bottom) + 118px);
  }
}
</style>
</head>

<body>
<main id="app">

<section class="top">
  <div
    id="priceBox"
    class="pricebox"
    title="Concrete cost estimate"
  >
    <svg
      id="priceSvg"
      class="price-svg"
      viewBox="0 0 260 64"
      role="img"
      aria-label="$0"
    >
      <defs>
        <linearGradient
          id="priceFillGradient"
          x1="0%"
          y1="0%"
          x2="0%"
          y2="100%"
        >
          <stop offset="0%" stop-color="#ff1c33"/>
          <stop offset="32%" stop-color="#ff224f"/>
          <stop offset="62%" stop-color="#ff2f7e"/>
          <stop offset="100%" stop-color="#ff47bd"/>
        </linearGradient>

        <filter
          id="priceSoftRedGlow"
          x="-40%"
          y="-70%"
          width="180%"
          height="240%"
        >
          <feGaussianBlur stdDeviation="5.6"/>
        </filter>
      </defs>

      <text
        id="priceGlow"
        x="8"
        y="56"
        font-size="70"
        font-family="JetBrains Mono"
        font-weight="800"
        letter-spacing="-6"
        fill="#ff2f47"
        opacity=".62"
        filter="url(#priceSoftRedGlow)"
      >$0</text>

      <text
        id="priceRedAura"
        x="8"
        y="56"
        font-size="70"
        font-family="JetBrains Mono"
        font-weight="800"
        letter-spacing="-6"
        fill="none"
        stroke="#ff3146"
        stroke-width="2.7"
        stroke-linejoin="round"
        stroke-linecap="round"
        opacity=".24"
        filter="url(#priceSoftRedGlow)"
      >$0</text>

      <text
        id="priceStroke"
        x="8"
        y="56"
        font-size="70"
        font-family="JetBrains Mono"
        font-weight="800"
        letter-spacing="-6"
        fill="none"
        stroke="#ffd84f"
        stroke-width="1.6"
        stroke-linejoin="round"
        stroke-linecap="round"
      >$0</text>

      <text
        id="priceFill"
        x="8"
        y="56"
        font-size="70"
        font-family="JetBrains Mono"
        font-weight="800"
        letter-spacing="-6"
        fill="url(#priceFillGradient)"
      >$0</text>
    </svg>
  </div>

  <div class="brand">
    Fabricable Fabric Formwork
  </div>

  <div class="right">
    <div class="play">Playground</div>
    <div id="version" class="ver">V24</div>
  </div>
</section>

<section id="view"></section>

<div id="hint" class="hint">
  Drag to rotate
</div>

<div class="legend">
  <i>Span</i>
  <span id="legSpan">0.00 m</span>
  <i>Height</i>
  <span id="legHeight">0.00 m</span>
  <i>Length</i>
  <span id="legLength">0.00 m</span>
</div>

<section id="main" class="panel">
  <div class="unit" data-key="diameter"></div>
  <div class="unit" data-key="span"></div>
  <div class="unit" data-key="height"></div>
</section>

<section id="array" class="panel">
  <div class="unit" data-key="arches"></div>
</section>

<section id="roots" class="panel">
  <div class="unit" data-key="roots"></div>
</section>

<section id="front" class="panel">
  <div class="head">
    <span class="side">Front</span>
    <button id="fixFront" class="fix" type="button">Fix</button>
  </div>

  <div class="unit" data-key="frontHeight"></div>
  <div class="unit" data-key="frontSpan"></div>
</section>

<section id="back" class="panel">
  <div class="head">
    <span class="side">Back</span>
    <button id="fixBack" class="fix" type="button">Fix</button>
  </div>

  <div class="unit" data-key="backHeight"></div>
  <div class="unit" data-key="backSpan"></div>
</section>

</main>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const VERSION = "V24";

const S = {
  diameter: 0.06,
  span: 2,
  height: 2,
  arches: 30,
  roots: 0.3,
  frontHeight: 0,
  frontSpan: 0,
  backHeight: 0,
  backSpan: 0,
  fixSide: null
};

const C = {
  diameter: [
    "Diameter",
    0.03,
    0.15,
    0.01,
    "m",
    2
  ],

  span: [
    "Span",
    0.5,
    5,
    0.05,
    "m",
    2
  ],

  height: [
    "Height",
    0.5,
    5,
    0.05,
    "m",
    2
  ],

  arches: [
    "Arches",
    1,
    100,
    1,
    "",
    0
  ],

  roots: [
    "Roots",
    0,
    1,
    0.05,
    "m",
    2
  ],

  frontHeight: [
    "Height mod",
    -50,
    50,
    1,
    "%",
    0,
    1
  ],

  frontSpan: [
    "Span mod",
    -50,
    50,
    1,
    "%",
    0,
    1
  ],

  backHeight: [
    "Height mod",
    -50,
    50,
    1,
    "%",
    0,
    1
  ],

  backSpan: [
    "Span mod",
    -50,
    50,
    1,
    "%",
    0,
    1
  ]
};

const UI =
  new Map();

const keys =
  Object.keys(C);

const $ =
  selector =>
    document.querySelector(
      selector
    );

const clamp =
  (
    value,
    minimum,
    maximum
  ) =>
    Math.min(
      maximum,
      Math.max(
        minimum,
        value
      )
    );

$("#version").textContent =
  VERSION;

const view =
  $("#view");

const hint =
  $("#hint");

const priceSvg =
  $("#priceSvg");

const priceBox =
  $("#priceBox");

function setPrice(
  text
){
  const textLength =
    Math.max(
      148,
      214 -
      Math.max(
        0,
        text.length - 3
      ) * 16
    );

  [
    "priceGlow",
    "priceRedAura",
    "priceStroke",
    "priceFill"
  ].forEach(
    id => {
      const element =
        document

      element.textContent =

      element.setAttribute(
        "textLength",
        String(
          textLength
        )
      );

      element.setAttribute(
        "lengthAdjust",
        "spacingAndGlyphs"
      );
    }
  );

  priceSvg.setAttribute(
    "aria-label",
    text
  );
}

function formatValue(
  key,
  value
){
  const config =
    C[key];

  const number =
    Number(value)
      .toFixed(
        config[5]
      );

  return config[4]
    ? `${number} ${config[4]}`
    : number;
}

function zeroClientX(
  range,
  config
){
  const rect =
    range.getBoundingClientRect();

  const thumb =
    11;

  const ratio =
    (
      0 -
      config[1]
    ) /
    (
      config[2] -
      config[1]
    );

  return (
    rect.left +
    thumb / 2 +
    ratio *
    Math.max(
      0,
      rect.width -
      thumb
    )
  );
}

function markZero(
  key
){
  const ui =
    UI.get(key);

  const config =
    C[key];

  if(
    !ui ||
    !config[6]
  ){
    return;
  }

  const box =
    ui.host.querySelector(
      ".sliderbox"
    );

  const rangeRect =
    ui.range
      .getBoundingClientRect();

  const boxRect =
    box
      .getBoundingClientRect();

  const thumb =
    11;

  const ratio =
    (
      0 -
      config[1]
    ) /
    (
      config[2] -
      config[1]
    );

  box.style.setProperty(
    "--zero",
    `${
      rangeRect.left -
      boxRect.left +
      thumb / 2 +
      ratio *
      Math.max(
        0,
        rangeRect.width -
        thumb
      )
    }px`
  );
}

function markThumb(
  key
){
  const ui =
    UI.get(key);

  const config =
    C[key];

  if(!ui){
    return;
  }

  const box =
    ui.host.querySelector(
      ".sliderbox"
    );

  const dot =
    ui.host.querySelector(
      ".thumbdot"
    );

  const rangeRect =
    ui.range
      .getBoundingClientRect();

  const boxRect =
    box
      .getBoundingClientRect();

  const thumb =
    13;

  const ratio =
    (
      S[key] -
      config[1]
    ) /
    (
      config[2] -
      config[1]
    );

  dot.style.left =
    `${
      rangeRect.left -
      boxRect.left +
      thumb / 2 +
      ratio *
      Math.max(
        0,
        rangeRect.width -
        thumb
      )
    }px`;
}

function buildControl(
  key
){
  const host =
    $(`[data-key="${key}"]`);

  const config =
    C[key];

  host.innerHTML = `
    <div class="row">

      <label class="label">
        ${config[0]}
      </label>

      <div class="step">

        <button data-a="-">
          −
        </button>

        <input
          inputmode="${config[5] ? "decimal" : "numeric"}"
        >

        <button data-a="+">
          +
        </button>

      </div>

    </div>

    <div class="sliderbox">

      <input
        class="slider"
        type="range"
        min="${config[1]}"
        max="${config[2]}"
        step="${config[3]}"
      >

      <i class="thumbdot"></i>

      ${
        config[6]
          ? '<i class="zero"></i>'
          : ""
      }

    </div>
  `;

  const input =
    host.querySelector(
      "input:not(.slider)"
    );

  const range =
    host.querySelector(
      ".slider"
    );

  const minus =
    host.querySelector(
      '[data-a="-"]'
    );

  const plus =
    host.querySelector(
      '[data-a="+"]'
    );

  UI.set(
    key,
    {
      host,
      input,
      range
    }
  );

  range.oninput =
    () => {
      let value =
        Number(
          range.value
        );

      if(
        config[6] &&
        Math.abs(value) <= 4
      ){
        value = 0;
      }

      setValue(
        key,
        value,
        true,
        false
      );
    };

  range.onpointerup =
    () => {
      if(
        config[6] &&
        Math.abs(
          Number(
            range.value
          )
        ) <= 5
      ){
        setValue(
          key,
          0,
          true,
          true
        );
      }
    };

  range.onclick =
    event => {
      if(
        config[6] &&
        Math.abs(
          event.clientX -
          zeroClientX(
            range,
            config
          )
        ) <= 18
      ){
        setValue(
          key,
          0,
          true,
          true
        );
      }
    };

  minus.onclick =
    () => {
      setValue(
        key,
        S[key] -
        config[3],
        true,
        true
      );
    };

  plus.onclick =
    () => {
      setValue(
        key,
        S[key] +
        config[3],
        true,
        true
      );
    };

  input.onfocus =
    () => {
      input.value =
        Number(
          S[key]
        )
        .toFixed(
          config[5]
        );

      input.select();
    };

  input.onkeydown =
    event => {
      if(
        event.key ===
        "Enter"
      ){
        input.blur();
      }
    };

  input.onblur =
    () => {
      const value =
        Number(
          input.value
            .replace(
              ",",
              "."
            )
            .replace(
              /[^\d.+-]/g,
              ""
            )
        );

      Number.isFinite(value)
        ? setValue(
            key,
            value,
            true,
            true
          )
        : syncControl(
            key
          );
    };

  syncControl(
    key
  );
}

function syncControl(
  key
){
  const ui =
    UI.get(key);

  const config =
    C[key];

  if(!ui){
    return;
  }

  ui.range.value =
    S[key];

  ui.input.value =
    formatValue(
      key,
      S[key]
    );

  ui.host.classList.toggle(
    "iszero",
    Boolean(
      config[6]
    ) &&
    S[key] === 0
  );

  requestAnimationFrame(
    () => {
      markZero(
        key
      );

      markThumb(
        key
      );
    }
  );
}

function setValue(
  key,
  value,
  rebuild = true,
  vibration = false
){
  const config =
    C[key];

  const previous =
    S[key];

  const decimals =
    String(
      config[3]
    )
    .includes(".")
      ? String(
          config[3]
        )
        .split(".")[1]
        .length
      : 0;

  S[key] =
    Number(
      clamp(
        Number(value),
        config[1],
        config[2]
      )
      .toFixed(
        decimals
      )
    );

  if(
    vibration &&
    config[6] &&
    S[key] === 0 &&
    previous !== 0 &&
    navigator.vibrate
  ){
    navigator.vibrate(
      6
    );
  }

  syncControl(
    key
  );

  if(rebuild){
    scheduleBuild();
  }
}

function noiseTexture(
  size,
  base,
  palette,
  count = 8000
){
  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    size;

  canvas.height =
    size;

  const context =
    canvas.getContext(
      "2d"
    );

  context.fillStyle =
    base;

  context.fillRect(
    0,
    0,
    size,
    size
  );

  for(
    let index = 0;
    index < count;
    index++
  ){
    const color =
      palette[
        Math.floor(
          Math.random() *
          palette.length
        )
      ];

    const radius =
      0.25 +
      Math.random() *
      1.6;

    context.fillStyle =
      `rgba(${color[0]},${color[1]},${color[2]},${0.04 + Math.random() * 0.13})`;

    context.beginPath();

    context.arc(
      Math.random() *
      size,
      Math.random() *
      size,
      radius,
      0,
      Math.PI *
      2
    );

    context.fill();
  }

  const texture =
    new THREE.CanvasTexture(
      canvas
    );

  texture.wrapS =
    THREE.RepeatWrapping;

  texture.wrapT =
    THREE.RepeatWrapping;

  texture.repeat.set(
    2.7,
    2.7
  );

  texture.colorSpace =
    THREE.SRGBColorSpace;

  return texture;
}

function alphaTexture(){
  const size =
    512;

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    size;

  canvas.height =
    size;

  const context =
    canvas.getContext(
      "2d"
    );

  const gradient =
    context
      .createRadialGradient(
        size / 2,
        size / 2,
        size * 0.1,
        size / 2,
        size / 2,
        size * 0.49
      );

  gradient.addColorStop(
    0,
    "#fff"
  );

  gradient.addColorStop(
    0.6,
    "rgba(255,255,255,.94)"
  );

  gradient.addColorStop(
    0.82,
    "rgba(255,255,255,.5)"
  );

  gradient.addColorStop(
    1,
    "transparent"
  );

  context.fillStyle =
    gradient;

  context.fillRect(
    0,
    0,
    size,
    size
  );

  return new THREE.CanvasTexture(
    canvas
  );
}

function terrainRandom(
  seed
){
  let state =
    seed >>> 0;

  return () => {
    state +=
      0x6D2B79F5;

    let value =
      state;

    value =
      Math.imul(
        value ^
        value >>> 15,
        value | 1
      );

    value ^=
      value +
      Math.imul(
        value ^
        value >>> 7,
        value | 61
      );

    return (
      (
        value ^
        value >>> 14
      ) >>> 0
    ) /
    4294967296;
  };
}

    context.beginPath();
    context.ellipse(
      0,

      radiusX,
      radiusY,
      0,
      0,
      Math.PI * 2
    );
    context.fill();
    context.restore();
  }

  context.filter =
    "blur(12px)";

  for(

  ){

      58 +

    context.fillStyle =
      `rgba(${gray},${gray + 3},${gray - 2},${alpha})`;

    context.beginPath();
    context.ellipse(
      random() * size,
      random() * size,
      26 + random() * 120,
      18 + random() * 88,
      random() * Math.PI,
      0,
      Math.PI * 2
    );

  context.filter =
    "none";

  for(

  ){

function roughnessMask(
  x,
  y
){
  const large =
    0.5 +
    0.25 *
    Math.sin(
      x * 0.72 +
      y * 0.33
    ) +
    0.18 *
    Math.sin(
      x * 0.24 -
      y * 0.57 +
      1.2
    ) +
    0.12 *
    Math.cos(
      x * 0.51 +
      y * 0.44 -
      0.7
    );

  return clamp(
    large,
    0.12,
    0.96
  );
}

function groundHeightAt(
  x,
  y
){
  const mask =
    roughnessMask(
      x,
      y
    );

  const broad =
    0.008 *
    Math.sin(
      x * 0.9 +
      y * 0.42
    ) +
    0.006 *
    Math.sin(
      y * 1.1 -
      x * 0.58
    ) +
    0.004 *
    Math.cos(
      (
        x + y
      ) * 0.7
    );

  const medium =
    mask *
    (
      0.0042 *
      Math.sin(
        x * 4.8 +
        y * 2.2
      ) +
      0.0036 *
      Math.cos(
        x * 3.6 -
        y * 5.1
      )
    );

  const micro =
    mask * mask *
    (
      0.0019 *
      Math.sin(
        x * 15.2 -
        y * 13.7
      ) +
      0.0016 *
      Math.cos(
        x * 18.9 +
        y * 11.4
      ) +
      0.0012 *
      Math.sin(
        (
          x + y
        ) * 23.5
      )
    );

  return broad + medium + micro;
}

function solveA(
  span,
  height
){
  const halfSpan =
    span / 2;

  let low =
    Math.max(
      span / 10000,
      0.0001
    );

  let high =
    10000;

  for(
    let index = 0;
    index < 100;
    index++
  ){
    const a =
      (
        low +
        high
      ) /
      2;

    const value =
      a *
      (
        Math.cosh(
          Math.min(
            40,
            halfSpan / a
          )
        ) -
        1
      ) -
      height;

    value > 0
      ? low = a
      : high = a;
  }

  return (
    low +
    high
  ) /
  2;
}

function zAt(
  x,
  height,
  a
){
  return (
    height -
    a *
    (
      Math.cosh(
        x / a
      ) -
      1
    )
  );
}

function extendedHalfSpan(
  height,
  a,
  root
){
  const target =
    -root;

  let low =
    0;

  let high =
    a;

  while(
    zAt(
      high,
      height,
      a
    ) >
    target &&
    high < 1000
  ){
    high *=
      1.35;
  }

  for(
    let index = 0;
    index < 90;
    index++
  ){
    const middle =
      (
        low +
        high
      ) /
      2;

    zAt(
      middle,
      height,
      a
    ) >
    target
      ? low = middle
      : high = middle;
  }

  return (
    low +
    high
  ) /
  2;
}

class CatenaryCurve
extends THREE.Curve{

  constructor(
    span,
    height,
    roots,
    y
  ){
    super();

    this.height =
      height;

    this.y =
      y;

    this.a =
      solveA(
        span,
        height
      );

    this.groundHalf =
      span /
      2;

    this.extendedHalf =
      extendedHalfSpan(
        height,
        this.a,
        roots
      );
  }

  getPoint(
    t,
    target =
      new THREE.Vector3()
  ){
    const x =
      -this.extendedHalf +
      2 *
      this.extendedHalf *
      t;

    return target.set(
      x,
      this.y,
      zAt(
        x,
        this.height,
        this.a
      )
    );
  }
}

function createSlice(
  curve,
  start,
  end
){
  const points =
    [];

  for(
    let index = 0;
    index <= 72;
    index++
  ){
    points.push(
      curve
        .getPoint(
          THREE.MathUtils.lerp(
            start,
            end,
            index / 72
          )
        )
        .clone()
    );
  }

  return new THREE.CatmullRomCurve3(
    points,
    false,
    "centripetal"
  );
}

function sampleSlicePoints(

){
  const points =

  ){

      curve
        .getPoint(
          THREE.MathUtils.lerp(
            start,
            end,
            index /
            samples
          )
        )
        .clone()
    );
  }

}

){

  );
}

function archMismatch(
  firstSet,
  secondSet
){
  const samples =
    Math.min(
      firstSet.length,
      secondSet.length
    );

  let total =
    0;

  for(
    let index = 0;
    index < samples;
    index += 6
  ){
    const dx =
      firstSet[index].x -
      secondSet[index].x;

    const dz =
      firstSet[index].z -
      secondSet[index].z;

    total +=
      Math.hypot(
        dx,
        dz
      );
  }

  return total /
    Math.max(
      1,
      Math.ceil(
        samples / 6
      )
    );
}

function compensateBundle(
  pointSets,
  diameter
){
  if(
    !pointSets.length
  ){
    return [];
  }

  const count =
    pointSets.length;

  const centers =
    new Array(
      count
    )
    .fill(0);

  const basePitch =
    diameter * 0.955;

  const minimumPitch =
    diameter * 0.80;

  for(
    let index = 1;
    index < count;
    index++
  ){
    const mismatch =
      archMismatch(
        pointSets[index - 1],
        pointSets[index]
      );

    const overlapBias =
      clamp(
        mismatch /
        Math.max(
          diameter,
          1e-6
        ),
        0,
        0.55
      );

    const pitch =
      Math.max(
        minimumPitch,
        basePitch -
        diameter *
        0.22 *
        overlapBias
      );

    centers[index] =
      centers[index - 1] +
      pitch;
  }

  const mid =
    (
      centers[0] +
      centers[count - 1]
    ) / 2;

  return pointSets.map(
    (
      points,
      archIndex
    ) => {
      const y =
        centers[archIndex] -
        mid;

      return points.map(
        point =>
          new THREE.Vector3(
            point.x,
            y,
            point.z
          )
      );
    }
  );
}

function rootCurveFromAdjustedEnd(
  curve,
  start,
  end,
  adjustedEnd,
  adjustedAtEnd,
  samples = 42
){
  const points =
    sampleSlicePoints(
      curve,
      start,
      end,
      samples
    );

  const rawJoin =
    adjustedAtEnd
      ? points[
          points.length -
          1
        ]
      : points[0];

  const dx =
    adjustedEnd.x -
    rawJoin.x;

  const dz =
    adjustedEnd.z -
    rawJoin.z;

  points.forEach(
    (
      point,
      index
    ) => {
      const ratio =
        index /
        Math.max(
          1,
          points.length -
          1
        );

      const influence =
        adjustedAtEnd
          ? ratio
          : 1 -
            ratio;

      point.x +=
        dx *
        influence;

      point.z +=
        dz *
        influence;

      point.y =
        adjustedEnd.y;
    }
  );

  return curveFromPoints(
    points
  );
}

function curveLength(
  curve,
  divisions = 120
){
  let previous =
    curve
      .getPoint(0)
      .clone();

  const point =
    new THREE.Vector3();

  let length =
    0;

  for(
    let index = 1;
    index <= divisions;
    index++
  ){
    curve.getPoint(
      index /
      divisions,
      point
    );

    length +=
      point.distanceTo(
        previous
      );

    previous.copy(
      point
    );
  }

  return length;
}

function smooth(
  value
){
  const t =
    clamp(
      value,
      0,
      1
    );

  return (
    0.5 -
    0.5 *
    Math.cos(
      Math.PI *
      t
    )
  );
}

function halfWeight(
  index,
  count,
  side
){
  if(
    count <=
    1
  ){
    return 0;
  }

  const half =
    Math.floor(
      count /
      2
    );

  const odd =
    count %
    2 ===
    1;

  if(
    side ===
    "front"
  ){
    const neutral =
      odd
        ? half
        : half -
          1;

    const last =
      neutral -
      1;

    if(
      last <
      0 ||
      index >
      last
    ){
      return 0;
    }

    return smooth(
      (
        neutral -
        index
      ) /
      Math.max(
        1,
        neutral
      )
    );
  }

  const neutral =
    half;

  const first =
    neutral +
    1;

  if(
    first >=
    count ||
    index <
    first
  ){
    return 0;
  }

  return smooth(
    (
      index -
      neutral
    ) /
    Math.max(
      1,
      count -
      1 -
      neutral
    )
  );
}

function fullWeight(
  index,
  count,
  side
){
  if(
    count <=
    1
  ){
    return 1;
  }

  const position =
    index /
    (
      count -
      1
    );

  return side ===
    "front"
      ? smooth(
          1 -
          position
        )
      : smooth(
          position
        );
}

function modifierWeight(
  index,
  count,
  side
){
  if(
    S.fixSide ===
    side
  ){
    return fullWeight(
      index,
      count,
      side
    );
  }

  if(
    S.fixSide
  ){
    return 0;
  }

  return halfWeight(
    index,
    count,
    side
  );
}

function buildModel(){

    clamp(

    );

    );

  const minimumHeight =
    Math.max(
      S.diameter *
      1.25,
      0.16
    );

  const frontSpan =
    clamp(
      S.span *
      (
        1 +
        S.frontSpan /
        100
      ),
      minimumSpan,
      5
    );

  const frontHeight =
    clamp(
      S.height *
      (
        1 +
        S.frontHeight /
        100
      ),
      minimumHeight,
      5
    );

  const backSpan =
    clamp(
      S.span *
      (
        1 +
        S.backSpan /
        100
      ),
      minimumSpan,
      5
    );

  const backHeight =
    clamp(
      S.height *
      (
        1 +
        S.backHeight /
        100
      ),
      minimumHeight,
      5
    );

  const tubularSegments =
    count >
    70
      ? 110
      : count >
        40
        ? 140
        : 190;

  const radialSegments =
    count >
    70
      ? 10
      : count >
        40
        ? 12
        : 16;

  let totalTubeLength =
    0;

  let maximumSpan =
    S.span;

  let maximumHeight =
    S.height;

  const archData =
    [];

  for(
    let index = 0;
    index < count;
    index++
  ){
    const frontWeight =
      modifierWeight(
        index,
        count,
        "front"
      );

    const backWeight =
      modifierWeight(
        index,
        count,
        "back"
      );

    const span =
      clamp(
        S.span +
        (
          frontSpan -
          S.span
        ) *
        frontWeight +
        (
          backSpan -
          S.span
        ) *
        backWeight,
        minimumSpan,
        5
      );

    const height =
      clamp(
        S.height +
        (
          frontHeight -
          S.height
        ) *
        frontWeight +
        (
          backHeight -
          S.height
        ) *
        backWeight,
        minimumHeight,
        5
      );

    maximumSpan =
      Math.max(
        maximumSpan,
        span
      );

    maximumHeight =
      Math.max(
        maximumHeight,
        height
      );

    const curve =
      new CatenaryCurve(
        span,
        height,
        S.roots,
        0
      );

    const left =
      (
        curve.extendedHalf -
        curve.groundHalf
      ) /
      (
        2 *
        curve.extendedHalf
      );

    const right =
      (
        curve.extendedHalf +
        curve.groundHalf
      ) /
      (
        2 *
        curve.extendedHalf
      );

    archData.push({
      index,
      curve,
      left,
      right,
      rawPoints:
        sampleSlicePoints(
          curve,
          left,
          right,
          104
        )
    });
  }

  const adjustedSets =
    compensateBundle(
      archData.map(
        item =>
          item.rawPoints
      ),
      S.diameter
    );

  let minimumY =
    Infinity;

  let maximumY =
    -Infinity;

  adjustedSets.forEach(
    points => {
      points.forEach(
        point => {
          minimumY =
            Math.min(
              minimumY,
              point.y
            );

          maximumY =
            Math.max(
              maximumY,
              point.y
            );
        }
      );
    }
  );

  const totalLength =
    count === 1
      ? S.diameter
      : maximumY -
        minimumY +
        S.diameter;

  updateLighting(
    maximumSpan,
    maximumHeight,
    totalLength
  );

  archData.forEach(
    (
      item,
      index
    ) => {
      const adjustedPoints =
        adjustedSets[index];

      const arch =
        curveFromPoints(
          adjustedPoints
        );

      addTube(
        arch,
        radius,
        createMaterial(
          index,
          false
        ),
        tubularSegments,
        radialSegments,
        false
      );

      totalTubeLength +=
        curveLength(
          arch
        );

      if(
        S.roots >
        0.001
      ){
        const leftRoot =
          rootCurveFromAdjustedEnd(
            item.curve,
            0,
            item.left,
            adjustedPoints[0],
            true
          );

        const rightRoot =
          rootCurveFromAdjustedEnd(
            item.curve,
            item.right,
            1,
            adjustedPoints[
              adjustedPoints.length -
              1
            ],
            false
          );

        addTube(
          leftRoot,
          radius,
          createMaterial(
            index,
            true
          ),
          Math.max(
            45,
            tubularSegments >>
            1
          ),
          radialSegments,
          true
        );

        addTube(
          rightRoot,
          radius,
          createMaterial(
            index,
            true
          ),
          Math.max(
            45,
            tubularSegments >>
            1
          ),
          radialSegments,
          true
        );

        totalTubeLength +=
          curveLength(
            leftRoot,
            70
          ) +
          curveLength(
            rightRoot,
            70
          );
      }
    }
  );

  const volumeM3 =
    Math.PI *
    radius *
    radius *
    totalTubeLength;

  const costPLN =
    volumeM3 *
    CONCRETE_PLN_M3;

  const costUSD =
    costPLN /
    USD_PLN;

  const priceText =
    `$${Math.ceil(costUSD).toLocaleString("en-US")}`;

  setPrice(
    priceText
  );

  priceBox.title =
    `${volumeM3.toFixed(3)} m³ concrete / ` +
    `${costPLN.toFixed(0)} PLN / ` +
    `${priceText}`;

  legSpan.textContent =
    `${maximumSpan.toFixed(2)} m`;

  legHeight.textContent =
    `${maximumHeight.toFixed(2)} m`;

  legLength.textContent =
    `${totalLength.toFixed(2)} m`;

  controls.target.set(
    0,
    0,
    Math.max(
      0.72,
      maximumHeight *
      0.35
    )
  );
}
buildModel();

let demoTimer =
  0;

let demoFrame =
  0;

let demoStopped =
  false;

const demoStart = {
  span: 2,
  height: 2,
  arches: 30
};

const demoPeak = {
  span: 2.3,
  height: 2.25,
  arches: 36
};

function stopDemo(){
  if(
    demoStopped
  ){
    return;
  }

  demoStopped =
    true;

  clearTimeout(
    demoTimer
  );

  cancelAnimationFrame(
    demoFrame
  );
}

function runDemo(){
  if(
    demoStopped
  ){
    return;
  }

  const startTime =
    performance.now();

  const duration =
    4200;

  function tick(
    now
  ){
    if(
      demoStopped
    ){
      return;
    }

    const progress =
      clamp(
        (
          now -
          startTime
        ) /
        duration,
        0,
        1
      );

    const movement =
      progress <
      0.46
        ? smooth(
            progress /
            0.46
          )
        : progress <
          0.6
          ? 1
          : 1 -
            smooth(
              (
                progress -
                0.6
              ) /
              0.4
            );

    S.span =
      Number(
        THREE.MathUtils
          .lerp(
            demoStart.span,
            demoPeak.span,
            movement
          )
          .toFixed(
            2
          )
      );

    S.height =
      Number(
        THREE.MathUtils
          .lerp(
            demoStart.height,
            demoPeak.height,
            movement
          )
          .toFixed(
            2
          )
      );

    S.arches =
      Math.round(
        THREE.MathUtils
          .lerp(
            demoStart.arches,
            demoPeak.arches,
            movement
          )
      );

    syncControl(
      "span"
    );

    syncControl(
      "height"
    );

    syncControl(
      "arches"
    );

    scheduleBuild();

    if(
      progress <
      1
    ){
      demoFrame =
        requestAnimationFrame(
          tick
        );
    }else{
      Object.assign(
        S,
        demoStart
      );

      syncControl(
        "span"
      );

      syncControl(
        "height"
      );

      syncControl(
        "arches"
      );

      scheduleBuild();

      demoStopped =
        true;
    }
  }

  demoFrame =
    requestAnimationFrame(
      tick
    );
}

[
  "pointerdown",
  "touchstart",
  "wheel",
  "keydown"
]
.forEach(
  eventName => {
    addEventListener(
      eventName,
      stopDemo,
      {
        capture:true,
        passive:
          eventName !==
          "keydown"
      }
    );
  }
);

demoTimer =
  setTimeout(
    runDemo,
    850
  );

function resize(){
  camera.aspect =
    innerWidth /
    innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  requestAnimationFrame(
    () => {
      keys.forEach(
        key => {
          markZero(
            key
          );

          markThumb(
            key
          );
        }
      );
    }
  );
}

addEventListener(
  "resize",
  resize,
  {
    passive:true
  }
);

const clock =
  new THREE.Clock();

function animate(){
  requestAnimationFrame(
    animate
  );

  controls.update(
    Math.min(
      clock.getDelta(),
      0.04
    )
  );

  renderer.render(
    scene,
    camera
  );
}

animate();
</script>
